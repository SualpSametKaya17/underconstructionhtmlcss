<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitemiz Yapım Aşamasındadır</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="content">
            <div class="icon-wrapper">
                <i class="fas fa-tools"></i>
            </div>
            <h1>Sitemiz Yapım Aşamasındadır</h1>
            <p class="subtitle">Çok yakında sizlerle olacağız!</p>
            <p class="description">Harika bir deneyim sunmak için çalışıyoruz. Lütfen daha sonra tekrar kontrol edin.</p>

            <div class="social-media">
                <h2>Bizi Takip Edin</h2>
                <div class="social-links">
                    <a href="#" class="social-box facebook" target="_blank">
                        <i class="fab fa-facebook-f"></i>
                        <span>Facebook</span>
                    </a>
                    <a href="#" class="social-box twitter" target="_blank">
                        <i class="fab fa-twitter"></i>
                        <span>Twitter</span>
                    </a>
                    <a href="#" class="social-box instagram" target="_blank">
                        <i class="fab fa-instagram"></i>
                        <span>Instagram</span>
                    </a>
                    <a href="#" class="social-box linkedin" target="_blank">
                        <i class="fab fa-linkedin-in"></i>
                        <span>LinkedIn</span>
                    </a>
                    <a href="#" class="social-box youtube" target="_blank">
                        <i class="fab fa-youtube"></i>
                        <span>YouTube</span>
                    </a>
                    <a href="#" class="social-box github" target="_blank">
                        <i class="fab fa-github"></i>
                        <span>GitHub</span>
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
