<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life&Garden - Yakında</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="content">
            <!-- Logo Alanı -->
            <div class="logo-container">
                <img src="logo.png" alt="Life&Garden Logo" class="logo">
            </div>

            <h1>Life&Garden</h1>
            <div class="icon-wrapper">
                <i class="fas fa-seedling"></i>
            </div>
            <p class="subtitle">Sitemiz Yapım Aşamasındadır</p>
            <p class="description">Doğa ve yaşamın buluştuğu özel bir deneyim için hazırlanıyoruz. Çok yakında sizlerle olacağız!</p>

            <div class="social-media">
                <h2>Bizi Takip Edin</h2>
                <div class="social-links">
                    <a href="#" class="social-box facebook" target="_blank">
                        <i class="fab fa-facebook-f"></i>
                        <span>Facebook</span>
                    </a>
                    <a href="#" class="social-box instagram" target="_blank">
                        <i class="fab fa-instagram"></i>
                        <span>Instagram</span>
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
